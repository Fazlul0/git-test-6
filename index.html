<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Todo</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --text: #e6e8ee;
    --muted: #9aa3b2;
    --accent: #6c8cff;
    --danger: #ff6b6b;
    --border: #262b36;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 16px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .app {
    width: 100%;
    max-width: 460px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
  }

  h1 {
    margin: 0 0 16px;
    font-size: 20px;
    letter-spacing: -0.01em;
  }

  .add-row {
    display: flex;
    gap: 8px;
  }

  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }

  input[type="text"]:focus {
    border-color: var(--accent);
  }

  button {
    font: inherit;
    cursor: pointer;
    border-radius: 9px;
    border: 1px solid transparent;
    transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
  }

  .btn-add {
    padding: 10px 14px;
    background: var(--accent);
    color: #0b0d12;
    font-weight: 600;
  }

  .btn-add:hover { filter: brightness(1.08); }

  .btn-ghost {
    padding: 6px 10px;
    background: transparent;
    color: var(--muted);
    border-color: var(--border);
    font-size: 13px;
  }

  .btn-ghost:hover { color: var(--text); border-color: #39404e; }
  .btn-ghost.active { color: var(--text); border-color: var(--accent); }

  ul {
    list-style: none;
    margin: 16px 0 0;
    padding: 0;
  }

  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--panel-2);
    margin-bottom: 8px;
  }

  li label {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
    cursor: pointer;
  }

  input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
    flex: none;
    cursor: pointer;
  }

  .text {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
  }

  li.done .text {
    text-decoration: line-through;
    color: var(--muted);
  }

  .remove {
    background: transparent;
    color: var(--muted);
    border: none;
    font-size: 18px;
    line-height: 1;
    padding: 2px 6px;
  }

  .remove:hover { color: var(--danger); }

  .empty {
    padding: 18px 12px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
  }

  .filters { display: flex; gap: 6px; }

  .count { margin-right: auto; }
</style>
</head>
<body>
  <main class="app">
    <h1>Todo</h1>

    <form class="add-row" id="add-form" autocomplete="off">
      <input type="text" id="new-todo" placeholder="What needs doing?" aria-label="New todo" />
      <button class="btn-add" type="submit">Add</button>
    </form>

    <ul id="todo-list"></ul>

    <div class="footer" id="footer" hidden>
      <span class="count" id="count"></span>
      <div class="filters">
        <button class="btn-ghost active" type="button" data-filter="all">All</button>
        <button class="btn-ghost" type="button" data-filter="active">Active</button>
        <button class="btn-ghost" type="button" data-filter="done">Done</button>
      </div>
      <button class="btn-ghost" type="button" id="clear-done">Clear done</button>
    </div>
  </main>

<script>
(function () {
  const STORAGE_KEY = 'todo.items';
  const form = document.getElementById('add-form');
  const input = document.getElementById('new-todo');
  const list = document.getElementById('todo-list');
  const footer = document.getElementById('footer');
  const countEl = document.getElementById('count');
  const clearDoneBtn = document.getElementById('clear-done');
  const filterButtons = Array.from(document.querySelectorAll('[data-filter]'));

  let items = load();
  let filter = 'all';

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (err) {
      return [];
    }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function visibleItems() {
    if (filter === 'active') return items.filter((item) => !item.done);
    if (filter === 'done') return items.filter((item) => item.done);
    return items;
  }

  function render() {
    list.textContent = '';
    const shown = visibleItems();

    if (shown.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'empty';
      empty.textContent = items.length === 0 ? 'Nothing here yet. Add your first todo.' : 'No todos match this filter.';
      list.appendChild(empty);
    }

    shown.forEach((item) => {
      const li = document.createElement('li');
      if (item.done) li.classList.add('done');

      const label = document.createElement('label');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = item.done;
      checkbox.addEventListener('change', () => {
        item.done = checkbox.checked;
        save();
        render();
      });

      const text = document.createElement('span');
      text.className = 'text';
      text.textContent = item.text;

      const remove = document.createElement('button');
      remove.className = 'remove';
      remove.type = 'button';
      remove.textContent = '×';
      remove.setAttribute('aria-label', 'Delete todo');
      remove.addEventListener('click', () => {
        items = items.filter((entry) => entry.id !== item.id);
        save();
        render();
      });

      label.appendChild(checkbox);
      label.appendChild(text);
      li.appendChild(label);
      li.appendChild(remove);
      list.appendChild(li);
    });

    const active = items.filter((item) => !item.done).length;
    countEl.textContent = items.length === 0
      ? '0 items'
      : active + ' active / ' + items.length + ' total';
    footer.hidden = items.length === 0;
  }

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    items.unshift({ id: Date.now() + Math.random(), text: text, done: false });
    input.value = '';
    save();
    render();
    input.focus();
  });

  filterButtons.forEach((button) => {
    button.addEventListener('click', () => {
      filter = button.dataset.filter;
      filterButtons.forEach((other) => other.classList.toggle('active', other === button));
      render();
    });
  });

  clearDoneBtn.addEventListener('click', () => {
    items = items.filter((item) => !item.done);
    save();
    render();
  });

  render();
})();
</script>
</body>
</html>
